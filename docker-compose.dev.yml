version: '3.9'

# ─────────────────────────────────────────────────────────────────
# Override de développement — docker-compose.dev.yml
# Usage : docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ─────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev
    ports:
      - "3001:3001"
      - "9229:9229"   # Node.js debugger

  frontend:
    build:
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    ports:
      - "3000:3000"

  postgres:
    ports:
      - "5432:5432"   # Exposé en local pour accès direct (DBeaver, etc.)

  redis:
    ports:
      - "6379:6379"   # Exposé en local pour débogage

  # Adminer — Interface web PostgreSQL (dev uniquement)
  adminer:
    image: adminer:latest
    container_name: santeconnect-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - santeconnect-network

  # Redis Commander — Interface web Redis (dev uniquement)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: santeconnect-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - santeconnect-network
